<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Student Dashboard</title>
    </head>
    <body>
    <header>
    <h1>Student Dashboard</h1>
    <p>University Student Portal</p>
    </header>

    <main className="topicHeader" id="student-dashboard">
    <section id="gpa">
        <h2>GPA Calculator</h2>
        <p>Calculate your GPA based on your grades.</p>
        <input type="text" id="grades-input" placeholder="Enter grades (comma-separated)" /><br />
        <button type="button" onclick="takeGrades()">Enter Grades</button>
        <button type="button" onclick="calculateGPA()">Calculate GPA</button>
        <p id="gpa-result">GPA results: </p>
    </section>

    </main>
    <script src="script.js"></script>
    </body>
</html>
