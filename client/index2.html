<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Standalone student GPA calculator teaching example" />
    <title>Student GPA Calculator</title>

    <!-- This lesson keeps its CSS inside the HTML file so it only needs
         index2.html and script2.js. A class can style several elements, while
         an ID identifies one specific element for a link or JavaScript. -->
    <style>
      :root {
        font-family: Inter, Arial, sans-serif;
        color: #123524;
        background: white;
        line-height: 1.6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      :focus-visible {
        outline: 3px solid #123524;
        outline-offset: 3px;
        box-shadow: 0 0 0 3px white;
      }

      .skip-link {
        position: fixed;
        top: .5rem;
        left: .5rem;
        z-index: 10;
        transform: translateY(-200%);
        padding: .75rem 1rem;
        color: #123524;
        background: white;
        font-weight: 700;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .page-header {
        padding: 1.5rem clamp(1rem, 4vw, 4rem);
        color: white;
        background: #075c35;
      }

      .page-header h1 {
        margin: 0;
        line-height: 1.2;
      }

      .page-header p {
        margin: .35rem 0 0;
      }

      .dashboard {
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem clamp(1rem, 4vw, 2rem) 4rem;
      }

      .dashboard-card {
        padding: 1.5rem;
        border: 1px solid #b2ccbd;
        border-radius: .85rem;
        background: #f3faf5;
        box-shadow: 0 4px 14px rgb(7 92 53 / 5%);
      }

      .dashboard-card h2 {
        margin: 0 0 .75rem;
      }

      .metric {
        margin: 0;
        color: #075c35;
        font-size: 2.75rem;
        line-height: 1.2;
        font-weight: 750;
      }

      .gpa-form {
        margin-top: 1.25rem;
      }

      .gpa-form label {
        display: block;
        margin-bottom: .35rem;
        font-weight: 700;
      }

      .entry-row {
        display: flex;
        flex-wrap: wrap;
        gap: .65rem;
      }

      .entry-row input {
        flex: 1 1 10rem;
        min-width: 0;
        min-height: 44px;
        padding: .65rem .75rem;
        border: 1px solid #568069;
        border-radius: .45rem;
        color: #123524;
        background: white;
        font: inherit;
      }

      button {
        min-height: 44px;
        padding: .65rem 1rem;
        border: 2px solid #075c35;
        border-radius: .45rem;
        color: white;
        background: #075c35;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #06472a;
      }

      button:disabled {
        border-color: #718078;
        background: #718078;
        cursor: not-allowed;
      }

      .field-help,
      .field-error {
        margin: .5rem 0 0;
        font-size: .9rem;
      }

      .field-error {
        color: #9b1c1c;
        font-weight: 650;
      }

      .grade-list-area {
        margin-top: 1.25rem;
      }

      .grade-list-area h3 {
        margin: 0 0 .5rem;
        font-size: 1.05rem;
      }

      .grade-list {
        margin: 0;
        padding-left: 1.5rem;
      }

      .grade-list li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: .3rem 0;
        border-bottom: 1px solid #b2ccbd;
      }

      .calculate-button {
        width: 100%;
        margin-top: 1.25rem;
      }

      @media (max-width: 480px) {
        .dashboard-card {
          padding: 1.25rem;
        }

        .entry-row button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="page-header">
      <h1>Student Dashboard</h1>
      <p>Standalone HTML and JavaScript teaching example</p>
    </header>

    <main id="main-content" class="dashboard">
      <section class="dashboard-card" aria-labelledby="gpa-heading">
        <h2 id="gpa-heading">GPA Calculator</h2>

        <!-- JavaScript changes this text after Calculate GPA is selected. -->
        <p id="gpa-value" class="metric" aria-live="polite">--</p>
        <p>Calculated GPA · equal weight per grade</p>

        <!-- Submitting a form lets Enter and the button perform the same action. -->
        <form id="grade-form" class="gpa-form" novalidate>
          <label for="grade-entry">Enter a letter grade</label>
          <div class="entry-row">
            <input
              id="grade-entry"
              name="grade"
              type="text"
              placeholder="A-"
              maxlength="3"
              autocomplete="off"
              aria-describedby="grade-help"
            />
            <button type="submit">Add Grade</button>
          </div>
          <p id="grade-help" class="field-help">
            Accepted grades: A+, A, A-, B+, B, B-, C+, C, C-, D+, D, D-, and F.
          </p>
          <p id="grade-error" class="field-error" role="alert" hidden></p>
        </form>

        <div class="grade-list-area">
          <h3>Grades entered</h3>
          <p id="empty-list-message">No grades entered yet.</p>
          <ol id="grade-list" class="grade-list" aria-label="Grades entered"></ol>
        </div>

        <button id="calculate-button" class="calculate-button" type="button" disabled>
          Calculate GPA
        </button>
      </section>
    </main>

    <!-- defer waits until the HTML is parsed before script2.js runs. -->
    <script src="./script2.js" defer></script>
  </body>
</html>
